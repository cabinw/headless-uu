name: 问题反馈 / Bug report
description: 无头登录、连接或 TCP 映射问题 / Headless login, connection or TCP mapping problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交 token、配置文件、二维码、SSH 私钥或转发内容。
        Do not include tokens, configuration files, QR codes, SSH private keys or forwarded data.
  - type: textarea
    id: problem
    attributes:
      label: 复现步骤与结果 / Steps and result
      description: 包含预期行为、实际行为及是否可重复 / Include expected behavior, actual behavior and reproducibility.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit / Version or commit
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: 官方客户端平台和版本 / Official client platform and version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 本地诊断 / Local diagnostics
      description: |
        提供 uuremote-server doctor、操作系统/架构，以及当前连接 route=direct 或 route=relay。
        如需日志，只贴与问题相关且已审查的行。不要贴完整 config.json 或登录输出。
        Include uuremote-server doctor, OS/architecture and the current connection's route=direct or route=relay.
        Review any relevant log lines before posting. Never attach config.json or login output.
      render: text
