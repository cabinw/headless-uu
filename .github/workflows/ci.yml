name: Headless CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - name: Check synthetic TCP probe (offline)
        run: python3 tests/support/tcp_mapping_probe.py selfcheck
      - run: cargo build --locked --bin uuremote-server
      - run: target/debug/uuremote-server help
      - name: Verify no graphical or media linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          readelf -d target/debug/uuremote-server > "$RUNNER_TEMP/headless-needed.txt"
          cat "$RUNNER_TEMP/headless-needed.txt"
          if grep NEEDED "$RUNNER_TEMP/headless-needed.txt" | grep -Eiq 'lib(gtk|gdk|X11|Xext|Xtst|Xfixes|xcb|wayland|avcodec|avformat|avdevice|swscale|SDL|pipewire|pulse|opus|pam)'; then
            exit 1
          fi
      - name: Validate packaging script and service
        if: runner.os == 'Linux'
        run: |
          sh -n packaging/tarball/install.sh
          sed "s|ExecStart=/usr/local/bin/uuremote-server run|ExecStart=$GITHUB_WORKSPACE/target/debug/uuremote-server run|" packaging/systemd/cabinw-uuremote.service > "$RUNNER_TEMP/cabinw-uuremote.service"
          systemd-analyze verify "$RUNNER_TEMP/cabinw-uuremote.service"
