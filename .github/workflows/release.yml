name: Build headless packages
# Produces artifacts only. Publication is a separate reviewed operation.
on:
  workflow_dispatch:
  push:
    tags: ['headless-v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-22.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked --bin uuremote-server
      - name: Verify runtime linkage
        shell: bash
        run: |
          readelf -d target/release/uuremote-server > "$RUNNER_TEMP/headless-needed.txt"
          if grep NEEDED "$RUNNER_TEMP/headless-needed.txt" | grep -Eiq 'lib(gtk|gdk|X11|Xext|Xtst|Xfixes|xcb|wayland|avcodec|avformat|avdevice|swscale|SDL|pipewire|pulse|opus|pam)'; then
            cat "$RUNNER_TEMP/headless-needed.txt"
            exit 1
          fi
      - name: Package binary and corresponding source
        shell: bash
        run: |
          revision=$(git rev-parse --short HEAD)
          name="cabinw-uu-headless-${revision}-${{ matrix.arch }}-linux"
          mkdir -p dist "$name/packaging/systemd"
          cp target/release/uuremote-server packaging/tarball/install.sh LICENSE README.md README.en.md "$name/"
          cp packaging/systemd/cabinw-uuremote.service "$name/packaging/systemd/"
          mkdir -p "$name/docs" "$name/docker"
          cp docs/headless-phase-a.md docs/headless-refactor.md docs/wallpaper.md "$name/docs/"
          cp docker/README.md "$name/docker/"
          mkdir -p "$name/third-party"
          find vendor -type f \( -iname 'license*' -o -iname 'copying*' -o -iname 'notice*' -o -name 'PATCHES.md' \) -exec cp --parents {} "$name/third-party/" \;
          printf 'Source: https://github.com/%s/tree/%s\nBuild: cargo build --release --locked --bin uuremote-server\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$name/SOURCE.txt"
          tar -czf "dist/$name.tar.gz" "$name"
          git archive --format=tar.gz --prefix=headless-uu-source/ HEAD > "dist/$name-source.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.arch }}
          path: dist/
