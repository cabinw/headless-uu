services:
  headless-uu:
    image: cabinw/headless-uu:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Linux only: 127.0.0.1 target addresses refer to the host's existing sshd.
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      UU_CONFIG: /config/config.json
      RUST_LOG: info
    volumes:
      - ./config:/config
